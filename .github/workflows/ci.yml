name: CI

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  build:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        # Usamos una ruta fija en C: para runners Windows
        vcpkgDirectory: C:\opt\artifacts\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

    - name: Install vcpkg dependencies (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Generar vcpkg.json
        '{ "name": "rustdesk", "version-string": "1.2.0", "dependencies": [ "libvpx", "libyuv", "aom", "opus" ] }' | Out-File -Encoding utf8 vcpkg.json

        # Instalar con la tripleta estática explícita
        & "$env:VCPKG_ROOT\vcpkg" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT/installed"

        # Verificar que los headers estén donde esperamos
        if (Test-Path "C:\opt\artifacts\vcpkg\installed\x64-windows-static\include\vpx") {
          Get-ChildItem "C:\opt\artifacts\vcpkg\installed\x64-windows-static\include\vpx" | ForEach-Object { Write-Host $_.Name }
        } else {
          Write-Host "Aviso: no se encontró la carpeta include/vpx en la ruta esperada."
        }

        # Exportar variables para bindgen y compilación (GITHUB_ENV)
        Add-Content -Path $env:GITHUB_ENV -Value 'BINDGEN_EXTRA_CLANG_ARGS=-IC:\opt\artifacts\vcpkg\installed\x64-windows-static\include'
        Add-Content -Path $env:GITHUB_ENV -Value 'INCLUDE=C:\opt\artifacts\vcpkg\installed\x64-windows-static\include'

    - name: Install prerequisites (Linux fallback)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        case ${{ matrix.job.target }} in
          x86_64-unknown-linux-gnu)
            sudo apt-get -y update
            sudo apt-get install -y clang cmake curl gcc git g++ libasound2-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libvdpau-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev nasm wget
            ;;
        esac

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: stable
        targets: ${{ matrix.job.target }}
        components: ''

    - name: Show version information (Rust, cargo, GCC)
      shell: bash
      run: |
        gcc --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

    - name: Build
      uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505
      with:
        use-cross: ${{ matrix.job.use-cross }}
        command: build
        args: --locked --release --target=${{ matrix.job.target }}

    - name: clean
      shell: bash
      run: |
        cargo clean

    - name: Set testing options
      id: test-options
      shell: bash
      run: |
        unset CARGO_TEST_OPTIONS
        case ${{ matrix.job.target }} in
          arm-* | aarch64-*)
            CARGO_TEST_OPTIONS="--lib --bin ${PROJECT_NAME}"
            ;;
          *)
            CARGO_TEST_OPTIONS="--workspace --no-fail-fast -- --skip test_get_cursor_pos --skip test_get_key_state"
            ;;
        esac;
        echo "CARGO_TEST_OPTIONS=${CARGO_TEST_OPTIONS}" >> $GITHUB_ENV
        echo "CARGO_TEST_OPTIONS=${CARGO_TEST_OPTIONS}" >> $GITHUB_OUTPUT

    - name: Run tests
      uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505
      with:
        use-cross: ${{ matrix.job.use-cross }}
        command: test
        args: --locked --target=${{ matrix.job.target }} ${{ steps.test-options.outputs.CARGO_TEST_OPTIONS}}

    - name: Upload Windows EXE Artifact
      if: matrix.job.target == 'x86_64-pc-windows-msvc'
      uses: actions/upload-artifact@v4
      with:
        name: Soporte-PCCreative-Windows
        path: target/${{ matrix.job.target }}/release/*.exe
